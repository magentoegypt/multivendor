# requires: HubAppVendors
# S5b a store page's Reviews tab (public, GET). Variables: {"code":"loly"}.
query HmSmokeStoreReviews($code: String!, $pageSize: Int = 20, $currentPage: Int = 1) {
  hmStoreReviews(code: $code, pageSize: $pageSize, currentPage: $currentPage) {
    summary { rating review_count }
    total_count
    page_info { current_page page_size total_pages }
    items {
      id
      nickname
      title
      text
      rating
      created_at
      product { name url_key thumbnail_url }
    }
  }
}
