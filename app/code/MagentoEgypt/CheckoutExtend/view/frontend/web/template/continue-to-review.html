<div class="hm-continue-review">
    <div class="hm-continue-review__note">
        <svg class="hm-continue-review__note-icon" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span data-bind="i18n: 'Your payment information is encrypted and secure'"></span>
    </div>

    <div class="hm-continue-review__actions">
        <button type="button"
                class="action hm-continue-review__back"
                data-bind="click: backToShipping">
            <span data-bind="i18n: 'Back'"></span>
        </button>

        <!--
            NOT `enable: isReady()`. A disabled .action.primary is given
            `pointer-events: none` by blank, so the click never reached the
            handler and pressing this did nothing at all with nothing said —
            which is CL036-TC34. The class keeps the unavailable LOOK; the
            handler explains what is missing.
        -->
        <button type="button"
                class="action primary checkout hm-continue-review__button"
                data-bind="click: continueToReview,
                           css: {'hm-continue-review__button--waiting': !isReady()}">
            <span data-bind="i18n: 'Review Order'"></span>
        </button>
    </div>
</div>
