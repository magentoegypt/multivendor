<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 470" width="180" height="470" role="img" aria-hidden="true" focusable="false">
  <!--
    Hub Market — app banner illustration.

    Figma pairs the "shop from all vendors in one app" copy with a phone mock
    showing a miniature of the storefront: orange brand bar, search field, two
    rows of category chips, a deals list, a primary action and a tab bar.
    Redrawn here rather than exported, so it carries no bitmap and no external
    font — it is a decorative background on .hm-app (see _hm-figma.less) and
    must stay small.

    The canvas is 180 x 470 (0.38), a phone's proportions. It was 180 x 260
    (0.69), which is a tablet — and because the CSS box draws this with
    `contain`, a taller box could not fix it: the artwork just letterboxed
    inside the box and rendered at the same size. The aspect has to change here.

    Colours are the theme's own tokens, hard-coded because an SVG referenced
    through background-image gets no access to the document's custom properties:
      #f26522 accent   #0f2144 navy   #e8ecf3 border   #6b7280 muted
  -->
  <defs>
    <clipPath id="hm-phone-screen">
      <rect x="12" y="14" width="156" height="442" rx="25"/>
    </clipPath>
  </defs>

  <!-- Device body -->
  <rect x="6" y="8" width="168" height="454" rx="30" fill="#ffffff" opacity=".14"/>
  <rect x="10" y="12" width="160" height="446" rx="27" fill="#ffffff"/>

  <g clip-path="url(#hm-phone-screen)">
    <!-- Status bar -->
    <rect x="12" y="14" width="156" height="20" fill="#0f2144"/>
    <rect x="76" y="21" width="28" height="5" rx="2.5" fill="#ffffff" opacity=".35"/>

    <!-- Brand bar -->
    <rect x="20" y="42" width="140" height="24" rx="7" fill="#f26522"/>
    <rect x="50" y="51" width="80" height="6" rx="3" fill="#ffffff" opacity=".9"/>

    <!-- Search field -->
    <rect x="20" y="74" width="140" height="20" rx="10" fill="#f5f7fa"/>
    <circle cx="32" cy="83" r="4.5" fill="none" stroke="#6b7280" stroke-width="1.6"/>
    <line x1="35.5" y1="86.5" x2="39" y2="90" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="46" y="80" width="64" height="5" rx="2.5" fill="#cbd3e2"/>

    <!-- Category chips, two rows of four -->
    <g>
      <rect x="20" y="104" width="32" height="34" rx="9" fill="#e8f5e9"/>
      <rect x="56" y="104" width="32" height="34" rx="9" fill="#e3f2fd"/>
      <rect x="92" y="104" width="32" height="34" rx="9" fill="#fff3e0"/>
      <rect x="128" y="104" width="32" height="34" rx="9" fill="#fce4ec"/>
      <circle cx="36" cy="117" r="5" fill="#0f7b3f" opacity=".45"/>
      <circle cx="72" cy="117" r="5" fill="#1d4ed8" opacity=".4"/>
      <circle cx="108" cy="117" r="5" fill="#b45309" opacity=".45"/>
      <circle cx="144" cy="117" r="5" fill="#c0392b" opacity=".35"/>
      <rect x="28" y="128" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="64" y="128" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="100" y="128" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="136" y="128" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>

      <rect x="20" y="144" width="32" height="34" rx="9" fill="#ede7f6"/>
      <rect x="56" y="144" width="32" height="34" rx="9" fill="#e0f7fa"/>
      <rect x="92" y="144" width="32" height="34" rx="9" fill="#fff8e1"/>
      <rect x="128" y="144" width="32" height="34" rx="9" fill="#eceff1"/>
      <circle cx="36" cy="157" r="5" fill="#5b3fa8" opacity=".4"/>
      <circle cx="72" cy="157" r="5" fill="#00707d" opacity=".4"/>
      <circle cx="108" cy="157" r="5" fill="#b7791f" opacity=".45"/>
      <circle cx="144" cy="157" r="5" fill="#455a64" opacity=".4"/>
      <rect x="28" y="168" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="64" y="168" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="100" y="168" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="136" y="168" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
    </g>

    <!-- Section label — "Today's Deals" -->
    <rect x="20" y="192" width="50" height="5" rx="2.5" fill="#0f2144" opacity=".8"/>

    <!-- Deal rows -->
    <g>
      <rect x="20" y="206" width="140" height="36" rx="9" fill="#f5f7fa"/>
      <rect x="27" y="213" width="22" height="22" rx="6" fill="#cbd3e2"/>
      <rect x="56" y="217" width="72" height="4" rx="2" fill="#cbd3e2"/>
      <rect x="56" y="226" width="36" height="5" rx="2.5" fill="#f26522"/>

      <rect x="20" y="250" width="140" height="36" rx="9" fill="#f5f7fa"/>
      <rect x="27" y="257" width="22" height="22" rx="6" fill="#cbd3e2"/>
      <rect x="56" y="261" width="62" height="4" rx="2" fill="#cbd3e2"/>
      <rect x="56" y="270" width="30" height="5" rx="2.5" fill="#f26522"/>

      <rect x="20" y="294" width="140" height="36" rx="9" fill="#f5f7fa"/>
      <rect x="27" y="301" width="22" height="22" rx="6" fill="#cbd3e2"/>
      <rect x="56" y="305" width="68" height="4" rx="2" fill="#cbd3e2"/>
      <rect x="56" y="314" width="33" height="5" rx="2.5" fill="#f26522"/>
    </g>

    <!-- Primary action — "Add to Cart" -->
    <rect x="20" y="344" width="140" height="24" rx="12" fill="#0f2144"/>
    <rect x="62" y="353" width="56" height="5" rx="2.5" fill="#ffffff" opacity=".85"/>

    <!-- Tab bar -->
    <rect x="12" y="410" width="156" height="46" fill="#ffffff"/>
    <line x1="12" y1="410" x2="168" y2="410" stroke="#e8ecf3" stroke-width="2"/>
    <circle cx="34" cy="430" r="5.5" fill="#f26522"/>
    <circle cx="67" cy="430" r="5.5" fill="#cbd3e2"/>
    <circle cx="100" cy="430" r="5.5" fill="#cbd3e2"/>
    <circle cx="133" cy="430" r="5.5" fill="#cbd3e2"/>
    <rect x="28" y="441" width="12" height="3" rx="1.5" fill="#f26522" opacity=".6"/>
    <rect x="61" y="441" width="12" height="3" rx="1.5" fill="#6b7280" opacity=".35"/>
    <rect x="94" y="441" width="12" height="3" rx="1.5" fill="#6b7280" opacity=".35"/>
    <rect x="127" y="441" width="12" height="3" rx="1.5" fill="#6b7280" opacity=".35"/>
  </g>

  <!-- Device outline over the screen edge -->
  <rect x="10" y="12" width="160" height="446" rx="27" fill="none" stroke="#0f2144" stroke-opacity=".18" stroke-width="2"/>
</svg>
