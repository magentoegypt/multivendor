# S4 brands (public, GET). Variables: {"featured_only":true} optional.
query HmSmokeBrands($featured_only: Boolean, $pageSize: Int = 100, $currentPage: Int = 1) {
  hmBrands(featured_only: $featured_only, pageSize: $pageSize, currentPage: $currentPage) {
    total_count
    page_info { current_page page_size total_pages }
    items { id option_id name url_key logo_url image_url is_featured link { type url path code } }
  }
}
