<div class="file-uploader-summary">
    <div class="file-uploader-preview">
        <a attr="href: $parent.getFilePreview($file),title:$file.name" target="_blank">
            <i attr="class: $parent.getClassIcon($file)"></i>
            <img
                    class="preview-image"
                    tabindex="0"
                    event="load: $parent.onPreviewLoad.bind($parent)"
                    attr="
                    src: $parent.getFilePreview($file),
                    alt: $file.name" if="!$parent.getClassIcon($file)">
        </a>
        <div class="actions">
            <button
                    type="button"
                    class="action-remove"
                    data-role="delete-button"
                    attr="title: $t('Delete image')"
                    click="$parent.removeFile.bind($parent, $file)">
                <span translate="'Delete image'"></span>
            </button>
        </div>
    </div>
    <div class="file-uploader-filename" text="$file.name"></div>
    <div class="file-uploader-meta">
        <text args="$file.previewWidth"></text>x<text args="$file.previewHeight"></text>,
        <text args="$parent.formatSize($file.size)"></text>
    </div>
    <input type="hidden" data-bind="value: $file.name" name="file_upload[]" />
</div>
