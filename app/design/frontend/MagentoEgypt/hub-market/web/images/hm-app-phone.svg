<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" width="180" height="260" role="img" aria-hidden="true" focusable="false">
  <!--
    Hub Market — app banner illustration.

    Figma pairs the "shop from all vendors in one app" copy with a phone mock
    showing a miniature of the storefront: orange brand bar, search field, a row
    of category chips, a deals list and a tab bar. Redrawn here rather than
    exported, so it carries no bitmap and no external font — it is a decorative
    background on .hm-app (see _hm-figma.less) and must stay small.

    Colours are the theme's own tokens, hard-coded because an SVG referenced
    through background-image gets no access to the document's custom properties:
      #f26522 accent   #0f2144 navy   #e8ecf3 border   #6b7280 muted
  -->
  <defs>
    <clipPath id="hm-phone-screen">
      <rect x="12" y="16" width="156" height="228" rx="18"/>
    </clipPath>
  </defs>

  <!-- Device body -->
  <rect x="6" y="10" width="168" height="240" rx="24" fill="#ffffff" opacity=".14"/>
  <rect x="10" y="14" width="160" height="232" rx="21" fill="#ffffff"/>

  <g clip-path="url(#hm-phone-screen)">
    <!-- Status bar -->
    <rect x="12" y="16" width="156" height="16" fill="#0f2144"/>
    <rect x="76" y="21" width="28" height="4" rx="2" fill="#ffffff" opacity=".35"/>

    <!-- Brand bar -->
    <rect x="20" y="38" width="140" height="20" rx="6" fill="#f26522"/>
    <rect x="52" y="45" width="76" height="6" rx="3" fill="#ffffff" opacity=".9"/>

    <!-- Search field -->
    <rect x="20" y="64" width="140" height="16" rx="8" fill="#f5f7fa"/>
    <circle cx="31" cy="72" r="4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
    <line x1="34" y1="75" x2="37" y2="78" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="44" y="69" width="60" height="5" rx="2.5" fill="#cbd3e2"/>

    <!-- Category chips -->
    <g>
      <rect x="20" y="88" width="32" height="30" rx="8" fill="#e8f5e9"/>
      <rect x="56" y="88" width="32" height="30" rx="8" fill="#e3f2fd"/>
      <rect x="92" y="88" width="32" height="30" rx="8" fill="#fff3e0"/>
      <rect x="128" y="88" width="32" height="30" rx="8" fill="#fce4ec"/>
      <circle cx="36" cy="100" r="5" fill="#0f7b3f" opacity=".45"/>
      <circle cx="72" cy="100" r="5" fill="#1d4ed8" opacity=".4"/>
      <circle cx="108" cy="100" r="5" fill="#b45309" opacity=".45"/>
      <circle cx="144" cy="100" r="5" fill="#c0392b" opacity=".35"/>
      <rect x="28" y="109" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="64" y="109" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="100" y="109" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
      <rect x="136" y="109" width="16" height="3" rx="1.5" fill="#6b7280" opacity=".45"/>
    </g>

    <!-- Section label -->
    <rect x="20" y="128" width="44" height="5" rx="2.5" fill="#0f2144" opacity=".8"/>

    <!-- Deal rows -->
    <g>
      <rect x="20" y="140" width="140" height="30" rx="8" fill="#f5f7fa"/>
      <rect x="26" y="146" width="18" height="18" rx="5" fill="#cbd3e2"/>
      <rect x="50" y="149" width="70" height="4" rx="2" fill="#cbd3e2"/>
      <rect x="50" y="157" width="34" height="5" rx="2.5" fill="#f26522"/>

      <rect x="20" y="176" width="140" height="30" rx="8" fill="#f5f7fa"/>
      <rect x="26" y="182" width="18" height="18" rx="5" fill="#cbd3e2"/>
      <rect x="50" y="185" width="62" height="4" rx="2" fill="#cbd3e2"/>
      <rect x="50" y="193" width="30" height="5" rx="2.5" fill="#f26522"/>
    </g>

    <!-- Primary action -->
    <rect x="20" y="214" width="140" height="16" rx="8" fill="#0f2144"/>
    <rect x="66" y="220" width="48" height="4" rx="2" fill="#ffffff" opacity=".85"/>
  </g>

  <!-- Device outline over the screen edge -->
  <rect x="10" y="14" width="160" height="232" rx="21" fill="none" stroke="#0f2144" stroke-opacity=".18" stroke-width="2"/>
</svg>
