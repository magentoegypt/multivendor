<!--
/**
 * Hub Market override of Vnecoms_Sms/account/authentication-popup.
 *
 * ONE CHANGE: the Sign In button's id, `send2` -> `hm-authpopup-submit`.
 *
 * This popup is declared in default.xml and renders on EVERY page, hidden and
 * first in the DOM. `send2` is Magento's conventional id for a form's submit
 * button, so the popup collided with every page that has one — the create-
 * account form and the contact form both ship `id="send2"` in core templates.
 *
 * WHY THIS SIDE, when the sibling fixes renamed the VISIBLE form instead.
 * Those renames existed so labels would resolve to real, visible controls, and
 * that only works if the thing the label points at is the thing on screen.
 * Nothing labels or references `send2` — no `for`, no ARIA, and no JavaScript
 * anywhere in vendor/magento or vendor/vnecoms; that was grepped, not assumed.
 * So the only question left was cost, and renaming here fixes every colliding
 * page at once from a 122-line template, where the alternative was carrying a
 * 402-line override of Magento_Customer::form/register.phtml — and another of
 * the contact form after it — and re-diffing both on every upgrade.
 */
-->

 -->

<div class="block-authentication"
     data-bind="afterRender: setModalElement, blockLoader: isLoading"
     style="display: none">
    <div class="block block-new-customer"
         data-bind="attr: {'data-label': $t('or')}">
        <div class="block-title">
            <strong id="block-new-customer-heading"
                    role="heading"
                    aria-level="2"
                    data-bind="i18n: 'Checkout as a new customer'"></strong>
        </div>
        <div class="block-content" aria-labelledby="block-new-customer-heading">
            <p data-bind="i18n: 'Creating an account has many benefits:'"></p>
            <ul>
                <li data-bind="i18n: 'See order and shipping status'"></li>
                <li data-bind="i18n: 'Track order history'"></li>
                <li data-bind="i18n: 'Check out faster'"></li>
            </ul>
            <div class="actions-toolbar">
                <div class="primary">
                    <a class="action action-register primary" data-bind="attr: {href: registerUrl}">
                        <span data-bind="i18n: 'Create an Account'"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="block block-customer-login"
         data-bind="attr: {'data-label': $t('or')}">
        <div class="block-title">
            <strong id="block-customer-login-heading"
                    role="heading"
                    aria-level="2"
                    data-bind="i18n: 'Checkout using your account'"></strong>
        </div>
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <!-- ko foreach: getRegion('before') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->
        <div class="block-content" aria-labelledby="block-customer-login-heading">
            <form class="form form-login"
                  method="post"
                  data-bind="event: {submit: login }"
                  id="login-form">
                <div class="fieldset login" data-bind="attr: {'data-hasrequired': $t('* Required Fields')}">
                    <div class="field email required">
                        <label class="label">
                            <!-- ko if: loginByMobile() -->
                            <a href="#" data-bind="click: toggleLoginField.bind($data)"><span data-bind="i18n: 'Email Address'"></span></a>
                            <span data-bind="i18n: 'or'"></span>
                            <strong data-bind="i18n: 'Mobile'"></strong>
                            <!-- /ko -->
                            <!-- ko ifnot: loginByMobile() -->
                            <strong data-bind="i18n: 'Email Address'"></strong>
                            <span data-bind="i18n: 'or'"></span>
                            <a href="#" data-bind="click: toggleLoginField.bind($data)"><span data-bind="i18n: 'Mobile'"></span></a>
                            <!-- /ko -->
                        </label>
                        <div class="control">
                            <input name="username"
                                   id="customer-email"
                                   type="email"
                                   class="input-text"
                                   data-mage-init='{"mage/trim-input":{}}'
                                   data-bind="attr: {autocomplete: autocomplete}, visible: !loginByMobile()"
                                   data-validate="{required:true, 'validate-email':true}">
                            <div data-bind="visible: loginByMobile()">
                                <input type="text"
                                       class="input-text"
                                       id="login-mobile"
                                       name="mobile"
                                       data-bind="
                                       attr: {autocomplete: autocomplete},
                                       afterRender: initMobileInput.bind($data)"
                                       data-validate="{required:true}" />
                                <input type="hidden" name="mobilenumber" id="mobile-number" data-bind="value: mobilenum"/>
                                <input type="hidden" name="login_type" id="login_type" data-bind="value:loginByMobile()?'by_mobile':'by_email'"/>
                            </div>
                        </div>
                    </div>
                    <div class="field password required">
                        <label for="pass" class="label"><span data-bind="i18n: 'Password'"></span></label>
                        <div class="control">
                            <input name="password"
                                   type="password"
                                   class="input-text"
                                   id="pass"
                                   data-bind="attr: {autocomplete: autocomplete}"
                                   data-validate="{required:true}">
                        </div>
                    </div>
                    <!-- ko foreach: getRegion('additional-login-form-fields') -->
                    <!-- ko template: getTemplate() --><!-- /ko -->
                    <!-- /ko -->
                    <div class="actions-toolbar">
                        <input name="context" type="hidden" value="checkout" />
                        <div class="primary">
                            <button type="submit" class="action action-login secondary" name="send" id="hm-authpopup-submit">
                                <span data-bind="i18n: 'Sign In'"></span>
                            </button>
                        </div>
                        <div class="secondary">
                            <a class="action" data-bind="attr: {href: forgotPasswordUrl}">
                                <span data-bind="i18n: 'Forgot Your Password?'"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
